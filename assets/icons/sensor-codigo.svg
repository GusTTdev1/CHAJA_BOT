<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="300" height="260" fill="#f2efe2"/>

  <!-- Zoom de la esquina del dispositivo (ampliada) -->
  <rect x="60" y="40" width="180" height="150" rx="14" fill="#ffffff" stroke="#cfc8ad" stroke-width="3"/>

  <!-- Rejilla de ventilación -->
  <line x1="80" y1="70" x2="150" y2="70" stroke="#d8d2ba" stroke-width="4"/>
  <line x1="80" y1="85" x2="150" y2="85" stroke="#d8d2ba" stroke-width="4"/>
  <line x1="80" y1="100" x2="150" y2="100" stroke="#d8d2ba" stroke-width="4"/>

  <!-- Etiqueta ampliada con el código -->
  <rect x="80" y="130" width="140" height="42" rx="6" fill="#fdf6e3" stroke="#b9b196" stroke-width="2"/>
  <text x="150" y="157" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#555">CHJ-XXXX-XXXX</text>

  <!-- Flecha señalando la etiqueta -->
  <path d="M245 150 L222 150" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="250" y="145" font-family="sans-serif" font-size="12" fill="#c0392b">Código de serie</text>

  <text x="150" y="220" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#777">Ubicación real puede variar según el aparato</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
