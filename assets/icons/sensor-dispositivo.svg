<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Pared -->
  <rect x="0" y="0" width="300" height="260" fill="#f2efe2"/>
  <!-- Zócalo -->
  <rect x="0" y="220" width="300" height="40" fill="#e3dcc2"/>

  <!-- Toma de corriente -->
  <rect x="190" y="150" width="60" height="70" rx="8" fill="#e8e4d6" stroke="#b9b196" stroke-width="2"/>
  <circle cx="210" cy="175" r="4" fill="#776f54"/>
  <circle cx="230" cy="175" r="4" fill="#776f54"/>
  <circle cx="210" cy="195" r="4" fill="#776f54"/>
  <circle cx="230" cy="195" r="4" fill="#776f54"/>

  <!-- Cable -->
  <path d="M190 185 C 165 185, 150 170, 130 160" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cuerpo del dispositivo (cuadrado blanco) -->
  <rect x="50" y="90" width="90" height="90" rx="12" fill="#ffffff" stroke="#cfc8ad" stroke-width="3"/>
  <!-- Led indicador -->
  <circle cx="125" cy="105" r="5" fill="#6fae63"/>
  <!-- Rejilla de ventilación -->
  <line x1="65" y1="130" x2="105" y2="130" stroke="#d8d2ba" stroke-width="3"/>
  <line x1="65" y1="140" x2="105" y2="140" stroke="#d8d2ba" stroke-width="3"/>
  <line x1="65" y1="150" x2="105" y2="150" stroke="#d8d2ba" stroke-width="3"/>

  <!-- Etiqueta de código (esquina inferior derecha del dispositivo) -->
  <rect x="98" y="155" width="38" height="18" rx="3" fill="#fdf6e3" stroke="#b9b196" stroke-width="1.5"/>
  <text x="117" y="167" font-family="monospace" font-size="7" text-anchor="middle" fill="#555">CHJ-XXXX</text>

  <!-- Texto aclaratorio -->
  <text x="150" y="245" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#777">Imagen provisoria</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
